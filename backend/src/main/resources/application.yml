server:
  port: ${PORT:8080}

spring:
  application:
    name: cinebook-backend

  datasource:
    url: ${DB_URL:jdbc:h2:mem:cinebook;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

logging:
  level:
    com.cinebook: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

